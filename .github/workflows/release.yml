name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: sni-spoof-rs-linux-amd64
            ui_name: sni-spoof-rs-ui-linux-amd64
            xray_asset: Xray-linux-64.zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: sni-spoof-rs-linux-amd64-musl
            ui_name: ""
            xray_asset: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: sni-spoof-rs-linux-arm64
            ui_name: ""
            xray_asset: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            name: sni-spoof-rs-macos-amd64
            ui_name: sni-spoof-rs-ui-macos-amd64
            xray_asset: Xray-macos-64.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            name: sni-spoof-rs-macos-arm64
            ui_name: sni-spoof-rs-ui-macos-arm64
            xray_asset: Xray-macos-arm64-v8a.zip
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            name: sni-spoof-rs-windows-amd64
            ui_name: sni-spoof-rs-ui-windows-amd64
            xray_asset: Xray-windows-64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MinGW toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Linux UI dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Configure GNU linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $gcc = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe" -replace '\\','/'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE/.cargo | Out-Null
          Add-Content -Path $env:USERPROFILE/.cargo/config.toml -Value '[target.x86_64-pc-windows-gnu]'
          Add-Content -Path $env:USERPROFILE/.cargo/config.toml -Value "linker = '$gcc'"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build UI
        if: matrix.ui_name != ''
        run: cargo build --release --target ${{ matrix.target }} --features ui --bin sni-spoof-rs-ui

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sni-spoof-rs dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}
          if [ -n "${{ matrix.ui_name }}" ]; then
            cp target/${{ matrix.target }}/release/sni-spoof-rs-ui dist/${{ matrix.ui_name }}
            chmod +x dist/${{ matrix.ui_name }}
            curl -fsSL "https://github.com/XTLS/Xray-core/releases/latest/download/${{ matrix.xray_asset }}" -o xray.zip
            mkdir -p xray-extracted
            unzip -o xray.zip xray -d xray-extracted
            chmod +x xray-extracted/xray
            bundle_dir="bundle-${{ matrix.ui_name }}"
            mkdir -p "${bundle_dir}"
            cp dist/${{ matrix.ui_name }} "${bundle_dir}/"
            cp xray-extracted/xray "${bundle_dir}/"
            tar -C "${bundle_dir}" -czf dist/${{ matrix.ui_name }}-bundle.tar.gz .
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/sni-spoof-rs.exe dist/${{ matrix.name }}/
          Copy-Item target/${{ matrix.target }}/release/sni-spoof-rs-ui.exe dist/${{ matrix.name }}/
          $sysFile = Get-ChildItem -Recurse -Path target -Filter "WinDivert64.sys" | Select-Object -First 1
          $dllFile = Get-ChildItem -Recurse -Path target -Filter "WinDivert.dll" | Select-Object -First 1
          if ($sysFile -and $dllFile) {
            Copy-Item $sysFile.FullName dist/${{ matrix.name }}/
            Copy-Item $dllFile.FullName dist/${{ matrix.name }}/
          } else {
            Write-Host "WinDivert files not found in build output, downloading from WinDivert release"
            Invoke-WebRequest -Uri "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile windivert.zip
            Expand-Archive windivert.zip -DestinationPath windivert-extracted
            Copy-Item windivert-extracted/WinDivert-2.2.2-A/x64/WinDivert.dll dist/${{ matrix.name }}/
            Copy-Item windivert-extracted/WinDivert-2.2.2-A/x64/WinDivert64.sys dist/${{ matrix.name }}/
          }
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/${{ matrix.xray_asset }}" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray-extracted -Force
          $xrayFile = Get-ChildItem -Recurse -Path xray-extracted -Filter "xray.exe" | Select-Object -First 1
          if (-not $xrayFile) {
            throw "xray.exe not found in Xray archive"
          }
          Copy-Item $xrayFile.FullName dist/${{ matrix.name }}/
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-extracted -Force
          Copy-Item wintun-extracted/wintun/bin/amd64/wintun.dll dist/${{ matrix.name }}/
          Compress-Archive -Path dist/${{ matrix.name }}/* -DestinationPath dist/${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          make_latest: true

      - name: Commit binaries to releases/ folder
        run: |
          mkdir -p releases
          cp dist/sni-spoof-rs-linux-amd64 releases/
          cp dist/sni-spoof-rs-linux-amd64-musl releases/ || true
          cp dist/sni-spoof-rs-linux-arm64 releases/
          cp dist/sni-spoof-rs-macos-amd64 releases/
          cp dist/sni-spoof-rs-macos-arm64 releases/
          cp dist/sni-spoof-rs-windows-amd64.zip releases/
          cp dist/sni-spoof-rs-ui-linux-amd64 releases/ || true
          cp dist/sni-spoof-rs-ui-macos-amd64 releases/ || true
          cp dist/sni-spoof-rs-ui-macos-arm64 releases/ || true
          cp dist/sni-spoof-rs-ui-linux-amd64-bundle.tar.gz releases/ || true
          cp dist/sni-spoof-rs-ui-macos-amd64-bundle.tar.gz releases/ || true
          cp dist/sni-spoof-rs-ui-macos-arm64-bundle.tar.gz releases/ || true
          chmod +x releases/sni-spoof-rs-linux-* releases/sni-spoof-rs-macos-*
          chmod +x releases/sni-spoof-rs-ui-* || true
          TAG="${GITHUB_REF#refs/tags/}"
          sed -i "s/Current version: \*\*v[0-9.]*\*\*/Current version: **${TAG}**/" releases/README.md || true
          sed -i "s/نسخه فعلی: \*\*v[0-9.]*\*\*/نسخه فعلی: **${TAG}**/" releases/README.md || true
          git config user.name "therealaleph"
          git config user.email "therealaleph@gmail.com"
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update prebuilt binaries to ${TAG}"
            git push origin HEAD:main
          fi
